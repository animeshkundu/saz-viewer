name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'
      - '!gh-pages'

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set deployment target
        id: target
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const repositoryName = process.env.REPOSITORY_NAME;

            if (branchName === 'main') {
              core.setOutput('base_path', `/${repositoryName}/`);
              return;
            }

            const branchSlug = branchName
              .toLowerCase()
              .replace(/[^a-z0-9._-]+/g, '-')
              .replace(/^-+|-+$/g, '');
            const safeBranchSlug = branchSlug || 'branch';
            const { createHash } = await import('node:crypto');
            const branchHash = createHash('sha256')
              .update(branchName)
              .digest('hex')
              .slice(0, 8);
            const destinationDir =
              `test-${safeBranchSlug}-${branchHash}`;

            core.setOutput(
              'base_path',
              `/${repositoryName}/${destinationDir}/`
            );

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.target.outputs.base_path }}
        run: npm run build

      - name: Check build artifacts
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build successful"
            ls -lah dist/
          else
            echo "❌ Build failed"
            exit 1
          fi

      - name: Upload deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-dist
          path: dist/
          retention-days: 1

  unit-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write  # Required for PR comments
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

      - name: Check coverage thresholds
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "✅ Coverage thresholds met"
          else
            echo "❌ Coverage thresholds not met"
            exit 1
          fi

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              
              const comment = `## 📊 Test Coverage Report
              
              | Metric | Coverage |
              |--------|----------|
              | Lines | ${total.lines.pct}% |
              | Statements | ${total.statements.pct}% |
              | Functions | ${total.functions.pct}% |
              | Branches | ${total.branches.pct}% |
              
              ${total.lines.pct >= 80 && total.statements.pct >= 80 && total.functions.pct >= 70 && total.branches.pct >= 75 ? '✅ All coverage thresholds met! (80%/80%/70%/75% required)' : '⚠️ Some coverage thresholds not met (80%/80%/70%/75% required)'}
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  e2e-test:
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
